name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgrouting/pgrouting:16-3.5-3.8
        env:
          POSTGRES_DB: grammap
          POSTGRES_USER: grammap
          POSTGRES_PASSWORD: grammap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grammap" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install GDAL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin libproj-dev
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check .
      - run: black --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
