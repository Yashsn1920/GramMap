# One command starts the whole development stack:  docker compose up
# Values come from .env if present, otherwise the defaults below (same as .env.example).

x-django: &django
  build:
    context: .
    dockerfile: backend/Dockerfile
  # run as the host user so files created in bind mounts (e.g. migrations) stay editable
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  env_file:
    - path: .env
      required: false
  environment:
    POSTGRES_HOST: db
    HOME: /tmp
    PYTEST_ADDOPTS: -p no:cacheprovider
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./backend:/app/backend
    - ./pipelines:/app/pipelines
    - ./config:/app/config
    - ./data:/app/data
    - ./docs:/app/docs
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgrouting/pgrouting:16-3.5-3.8
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grammap}
      POSTGRES_USER: ${POSTGRES_USER:-grammap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grammap}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/10-extensions.sql:/docker-entrypoint-initdb.d/zz-10-extensions.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    <<: *django
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  worker:
    <<: *django
    command: celery -A grammap worker -l info

  tiles:
    image: ghcr.io/maplibre/martin:1.16.1
    command: ["postgres://${POSTGRES_USER:-grammap}:${POSTGRES_PASSWORD:-grammap}@db:5432/${POSTGRES_DB:-grammap}"]
    ports:
      - "${TILES_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://backend:8000
      VITE_TILES_PROXY: http://tiles:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  pgdata:
